name: Definition validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  validate:
    name: Definition validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate definition and caller contracts
        run: |
          python3 -I -B -m unittest discover -s tests -p 'test_*.py' -v
          python3 -I -O -B -m unittest discover -s tests -p 'test_*.py' -v
